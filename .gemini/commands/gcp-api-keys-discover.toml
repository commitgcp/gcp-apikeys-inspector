description = "Generate and explain a Commit-branded GCP API keys report."

prompt = """
# Commit GCP API Keys Discover

Run the guided API key report workflow for this repository. This command is the
only agent entrypoint for the project and is fully self-contained.

User-provided command args:

{{args}}

## Discover, Confirm, Then Run

Do not run the report immediately. First discover visible organizations and
quota-project candidates, show the choices to the user, and ask which
organization and quota project to use for API key discovery.

Do not run any `gcloud auth application-default ...` command. Cloud Shell is
already authenticated through the active gcloud account; Application Default
Credentials are a separate credential store and are not required by this command.

Run deterministic discovery first:

```bash
scripts/gcp-api-keys-discover.sh --discover-only
```

Present the discovery output as a short, friendly choice list. Do not show raw
command chatter or internal source labels unless they help disambiguate choices.
Show:

- visible organization IDs, with display names when available
- visible project IDs, with their organization ancestor when available
- the active gcloud account

Then ask the user, in one concise question, to choose:

- target organization for API key discovery
- quota project for Cloud Asset Inventory API calls

If there is exactly one organization and one quota project candidate, ask the
user to confirm those defaults instead of making them retype the IDs.

If user-provided command args include organization or quota-project values,
still run discovery first and ask the user to confirm or change those values
against the discovered candidates.

Only after the user chooses both values, run the report script with explicit
arguments:

```bash
scripts/gcp-api-keys-discover.sh --organization "$ORG_ID" --quota-project "$QUOTA_PROJECT"
```

The script validates access, generates the report, and always starts a Cloud
Shell Web Preview server after a successful report so the user can inspect the
HTML file.

The report paths are fixed and overwritten on each run:

- HTML: `reports/index.html`
- JSON: `reports/report.json`

The preview server is rooted at `reports/`, so opening the Cloud Shell preview
port shows the HTML report directly instead of a repository directory listing.

If the script exits `2`, report the exact blocker and retry command it printed.
If the script exits `0`, treat the report generation as successful and use the
printed scanner status to distinguish CRITICAL findings from a clean run.

Required access if the script reports a permission blocker:

- `roles/cloudasset.viewer` or `cloudasset.assets.searchAllResources` on the organization.
- `roles/serviceusage.serviceUsageConsumer` or `serviceusage.services.use` on the quota project.
- Optional for display names: `roles/browser` or equivalent Resource Manager read access.

Script exit code handling:

- `0`: report generated successfully; scanner status in output says whether CRITICAL findings exist.
- `2`: scan failed; explain the blocker.

## Explain Results

Read the JSON report and summarize:

- exact HTML and JSON paths
- active and soft-deleted key totals
- severity counts
- CRITICAL and HIGH findings first
- keys without API target restrictions
- keys without client restrictions
- wildcard referrers or open server IP ranges
- projects/APIs with concentrated risk
- any display-name permission gaps

Do not claim API key secret values were inspected. The scanner reads metadata
and restrictions only.

## Preview Or Download

Use the script output for report paths, preview port, and download command.
Tell the user to use the Cloud Shell Web Preview menu:

- choose `Preview on port 8080` if `PORT=8080`
- otherwise choose `Change port` and enter the printed port

For download commands shown while the user is still inside Gemini CLI, prefix the
shell command with `!`, for example:

```text
! cloudshell download reports/index.html reports/report.json
```

End with a concise summary of the run, risks, report paths, and preview/download
instructions.
"""
