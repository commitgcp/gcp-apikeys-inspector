[project]
name = "gcp-api-keys-discover"
version = "0.1.0"
description = "Discover every API Key across a Google Cloud organization and produce a standalone HTML report."
requires-python = ">=3.10"
dependencies = [
    "google-cloud-asset>=3.27",
    "google-cloud-resource-manager>=1.13",
    "google-auth>=2.30",
    "jinja2>=3.1",
]

[project.scripts]
gcp-api-keys-discover = "discover:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gcp_api_keys"]
include = ["discover.py", "templates/*.j2", "assets/*.png", "scripts/*.sh"]
